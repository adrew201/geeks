services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: play2pro
      POSTGRES_PASSWORD: play2pro
      POSTGRES_DB: play2pro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
